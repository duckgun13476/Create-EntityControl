def cecDependencyCacheDays = providers.gradleProperty('cec.dependencyCacheDays')
        .map { it as int }
        .orElse(30)

allprojects {
    repositories {
        mavenLocal()
        mavenCentral()
        maven {
            name = 'Create'
            url = 'https://maven.createmod.net'
        }
        maven {
            name = 'CurseMaven'
            url = 'https://www.cursemaven.com'
            content {
                includeGroup 'curse.maven'
            }
        }
        maven {
            name = 'PinkCatsMaven'
            url = uri('https://logistics.aisaveworld.tech/d/share/maven/torque')
            content {
                includeGroup 'com.pinkcats.torque'
            }
        }
    }

    configurations.configureEach {
        resolutionStrategy.cacheChangingModulesFor cecDependencyCacheDays.get(), 'days'
        resolutionStrategy.cacheDynamicVersionsFor cecDependencyCacheDays.get(), 'days'
    }
}

apply from: rootProject.file('gradle/cec-publishing-root.gradle')

def versionProjects = [
        ':forge-1.19.2-0.5.1i',
        ':forge-1.20.1-0.5.1j',
        ':forge-1.20.1-6.0.x',
        ':neoforge-1.21.1',
        ':fabric-1.19.2',
        ':fabric-1.20.1'
]

tasks.register('compileJavaAllVersions') {
    group = 'build'
    description = 'Compiles every supported Create Entity Control version subproject.'
    dependsOn versionProjects.collect { "${it}:compileJava" }
}

tasks.register('jarAllVersions') {
    group = 'build'
    description = 'Alias for packageAllVersions; builds final publishable jars for every supported version.'
    dependsOn 'packageAllVersions'
}

def cachedClientRunProjects = [
        'forge1192'   : ':forge-1.19.2-0.5.1i',
        'forge1201j'  : ':forge-1.20.1-0.5.1j',
        'forge1201x'  : ':forge-1.20.1-6.0.x',
        'neoforge1211': ':neoforge-1.21.1',
        'fabric1192'  : ':fabric-1.19.2',
        'fabric1201'  : ':fabric-1.20.1'
]
def isWindowsHost = System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('windows')

cachedClientRunProjects.each { taskSuffix, projectPath ->
    tasks.register("runClientCached${taskSuffix.capitalize()}", Exec) {
        group = 'development'
        description = "Runs ${projectPath}:runClient with Gradle offline cache reuse."
        workingDir = rootProject.projectDir
        commandLine = [
                isWindowsHost ? rootProject.file('gradlew.bat').absolutePath : rootProject.file('gradlew').absolutePath,
                "${projectPath}:runClient",
                '--offline',
                '--no-daemon',
                '--console=plain'
        ]
    }
}
