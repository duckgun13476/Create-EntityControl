// CreateEntityControl publish mission

def cecResolveRepositoryRoot = {
    File current = project.projectDir
    while (current != null) {
        if (new File(current, 'gradle/cec-common.properties').exists()) {
            return current
        }
        current = current.parentFile
    }
    return rootProject.projectDir
}

def cecRepositoryRootDir = cecResolveRepositoryRoot()

ext.cecReadPublishingProperties = {
    def propertiesFile = new File(cecRepositoryRootDir, 'api.properties')
    if (!propertiesFile.exists()) {
        return null
    }

    def properties = new Properties()
    properties.load(new FileInputStream(propertiesFile))
    return properties
}

ext.cecReadPrimaryChangelog = {
    def changelogFile = new File(cecRepositoryRootDir, 'update/changelog.md')
    if (!changelogFile.exists()) {
        return ''
    }
    String text = changelogFile.getText('UTF-8')
    def matcher = text =~ /(?ms)\A\s*((?:#{2,4}\s+v?[^\n]+).*?)(?=\n#{2,4}\s+v?[^\n]+|\z)/
    return matcher.find() ? matcher.group(1).trim() : text.trim()
}

ext.cecReadFullChangelog = {
    def changelogFile = new File(cecRepositoryRootDir, 'update/changelog.md')
    return changelogFile.exists() ? changelogFile.getText('UTF-8') : ''
}

ext.cecReadStringListProperty = { String name, List<String> defaultValue = [] ->
    def value = project.findProperty(name)
    if (value == null) {
        return defaultValue
    }
    if (value instanceof Collection) {
        return value.collect { it.toString().trim() }.findAll { !it.isEmpty() }
    }
    return value.toString()
            .split(',')
            .collect { it.trim() }
            .findAll { !it.isEmpty() }
}

ext.cecReadBooleanProperty = { String name, boolean defaultValue = false ->
    def value = project.findProperty(name)
    if (value == null) {
        return defaultValue
    }
    String normalized = value.toString().trim().toLowerCase(Locale.ROOT)
    if (normalized in ['1', 'true', 'yes', 'y', 'on']) {
        return true
    }
    if (normalized in ['0', 'false', 'no', 'n', 'off']) {
        return false
    }
    return defaultValue
}

ext.cecPublishRemoteCheckEnabled = {
    return !cecReadBooleanProperty('cec_publish_remote_check_disabled', false)
}

ext.cecPublishCurseForgeRemoteCheckEnabled = {
    return cecPublishRemoteCheckEnabled() && !cecReadBooleanProperty('cec_publish_curseforge_remote_check_disabled', false)
}

ext.cecPublishModrinthRemoteCheckEnabled = {
    return cecPublishRemoteCheckEnabled() && !cecReadBooleanProperty('cec_publish_modrinth_remote_check_disabled', false)
}

ext.cecReadPublishArtifactTaskName = {
    return project.findProperty('cec_publish_artifact_task_name')?.toString()?.trim() ?: 'jar'
}

ext.cecReadPublishLoaderId = {
