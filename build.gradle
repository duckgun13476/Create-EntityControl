allprojects {
    repositories {
        mavenLocal()
        mavenCentral()
        maven {
            name = 'Create'
            url = 'https://maven.createmod.net'
        }
        maven {
            name = 'CurseMaven'
            url = 'https://www.cursemaven.com'
            content {
                includeGroup 'curse.maven'
            }
        }
        maven {
            name = 'PinkCatsMaven'
            url = uri('https://logistics.aisaveworld.tech/d/share/maven/torque')
            content {
                includeGroup 'com.pinkcats.torque'
            }
        }
    }
}

apply from: rootProject.file('gradle/cec-publishing-root.gradle')

def versionProjects = [
        ':forge-1.19.2-0.5.1i',
        ':forge-1.20.1-0.5.1j',
        ':forge-1.20.1-6.0.x',
        ':neoforge-1.21.1'
]

tasks.register('compileJavaAllVersions') {
    group = 'build'
    description = 'Compiles every supported Create Entity Control version subproject.'
    dependsOn versionProjects.collect { "${it}:compileJava" }
}

tasks.register('jarAllVersions') {
    group = 'build'
    description = 'Alias for packageAllVersions; builds final publishable jars for every supported version.'
    dependsOn 'packageAllVersions'
}
