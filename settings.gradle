pluginManagement {
    repositories {
        mavenLocal()
        gradlePluginPortal()
        mavenCentral()
        maven {
            name = 'NeoForge'
            url = 'https://maven.neoforged.net/releases'
        }
        maven {
            name = 'MinecraftForge'
            url = 'https://maven.minecraftforge.net/'
        }
        maven {
            name = 'Sponge'
            url = 'https://repo.spongepowered.org/repository/maven-public/'
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

// IntelliJ can inject org.jetbrains.gradle.ext before NeoForge ModDev applies.
// ModDev 2.0.107 then tries to apply the same IDEA extension during sync and
// fails with "Cannot add extension with name 'settings'". Keep Gradle sync/build
// usable by disabling ModDev's IntelliJ integration path for this multi-version
// project; run configurations can still be launched through Gradle tasks.
if (System.getProperty('idea.sync.active') == 'true') {
    System.setProperty('idea.sync.active', 'false')
}

def cecAutoOfflineForgeRuns = providers.gradleProperty('cec.autoOfflineForgeRuns')
        .map { it.toBoolean() }
        .orElse(true)
        .get()
if (cecAutoOfflineForgeRuns && gradle.startParameter.taskNames.any { taskName ->
    taskName.startsWith(':forge-') && (taskName.endsWith(':runClient') || taskName.endsWith(':prepareClientRun'))
}) {
    gradle.startParameter.offline = true
}

rootProject.name = 'CreateEntityControl'

include 'forge-1.19.2-0.5.1i'
include 'forge-1.20.1-0.5.1j'
include 'forge-1.20.1-6.0.x'
include 'neoforge-1.21.1'

project(':forge-1.19.2-0.5.1i').projectDir = file('project/forge/1.19.2-0.5.1i')
project(':forge-1.20.1-0.5.1j').projectDir = file('project/forge/1.20.1-0.5.1j')
project(':forge-1.20.1-6.0.x').projectDir = file('project/forge/1.20.1-6.0.x')
project(':neoforge-1.21.1').projectDir = file('project/neoforge/1.21.1')
