def cecResolveRepositoryRoot = {
    File current = project.projectDir
    while (current != null) {
        if (new File(current, 'settings.gradle').exists() && new File(current, 'project').exists()) {
            return current
        }
        current = current.parentFile
    }
    return rootProject.projectDir
}

def cecRepositoryRootDir = cecResolveRepositoryRoot()

ext.cecReadPublishingProperties = {
    def propertiesFile = new File(cecRepositoryRootDir, 'api.properties')
    if (!propertiesFile.exists()) {
        return null
    }

    def properties = new Properties()
    properties.load(new FileInputStream(propertiesFile))
    return properties
}

ext.cecReadPrimaryChangelog = {
    def changelogFile = new File(cecRepositoryRootDir, 'update/changelog.md')
    if (!changelogFile.exists()) {
        return ''
    }
    String text = changelogFile.getText('UTF-8')
    def matcher = text =~ /(?ms)\A\s*((?:#{2,4}\s+v?[^\n]+).*?)(?=\n#{2,4}\s+v?[^\n]+|\z)/
    return matcher.find() ? matcher.group(1).trim() : text.trim()
}

ext.cecReadFullChangelog = {
    def changelogFile = new File(cecRepositoryRootDir, 'update/changelog.md')
    return changelogFile.exists() ? changelogFile.getText('UTF-8') : ''
}

ext.cecReadStringListProperty = { String name, List<String> defaultValue = [] ->
    def value = project.findProperty(name)
    if (value == null) {
        return defaultValue
    }
    if (value instanceof Collection) {
        return value.collect { it.toString().trim() }.findAll { !it.isEmpty() }
    }
    return value.toString()
            .split(',')
            .collect { it.trim() }
            .findAll { !it.isEmpty() }
}

ext.cecReadPublishArtifactTaskName = {
    return project.findProperty('cec_publish_artifact_task_name')?.toString()?.trim() ?: 'jar'
}

ext.cecReadPublishArtifactFile = {
    def relativePath = project.findProperty('cec_publish_artifact_relative_path')?.toString()?.trim()
    if (relativePath != null && !relativePath.isEmpty()) {
        return project.file(relativePath)
    }

    def artifactTask = tasks.named(cecReadPublishArtifactTaskName()).get()
    if (!artifactTask.hasProperty('archiveFile')) {
        throw new GradleException("Publishing task '${artifactTask.name}' does not expose archiveFile in project '${project.path}'")
    }
    return artifactTask.archiveFile.get().asFile
}

ext.cecReadPublishLoaderId = {
    return project.findProperty('cec_publish_loader_id')?.toString()?.trim() ?: ''
}

ext.cecReadPublishDisplaySuffix = {
    def configuredSuffix = project.findProperty('cec_publish_display_suffix')?.toString()?.trim()
    if (configuredSuffix != null && !configuredSuffix.isEmpty()) {
        return configuredSuffix.startsWith('_') ? configuredSuffix : "_${configuredSuffix}"
    }
    def loaderId = cecReadPublishLoaderId()
    return loaderId ? "_${loaderId}" : ''
}

ext.cecReadPublishVersionSuffix = {
    def configuredSuffix = project.findProperty('cec_publish_version_suffix')?.toString()?.trim()
    if (configuredSuffix != null && !configuredSuffix.isEmpty()) {
        return configuredSuffix.startsWith('-') ? configuredSuffix : "-${configuredSuffix}"
    }
    def loaderId = cecReadPublishLoaderId()
    return loaderId ? "-${loaderId}" : ''
}

ext.cecReadPublishDisplayName = {
    def versionParts = mod_version.toString().split('-', 2)
    def createPart = versionParts.length > 1 ? versionParts[1] : ''
    def createSuffix = createPart.isEmpty() ? '' : "_for_Create_v${createPart}"
    return "${display_name}_v${versionParts[0]}${createSuffix}${cecReadPublishDisplaySuffix()}"
}

ext.cecReadPublishVersionId = {
    return "${minecraft_version}-${mod_version}${cecReadPublishVersionSuffix()}"
}

ext.cecReadCurseForgeLoaders = {
    return cecReadStringListProperty('cec_publish_curseforge_loaders')
}

ext.cecReadModrinthLoaders = {
    return cecReadStringListProperty('cec_publish_modrinth_loaders')
}

ext.cecReadRequiredDependencies = {
    return cecReadStringListProperty('cec_publish_required_dependencies', ['create'])
}

ext.cecReadOptionalDependencies = {
    return cecReadStringListProperty('cec_publish_optional_dependencies', ['jei', 'observable'])
}

ext.cecVerifyPublishArtifactFile = {
    File artifactFile = cecReadPublishArtifactFile()
    if (!artifactFile.isFile()) {
        throw new GradleException("Publish artifact does not exist for '${project.path}': ${artifactFile.absolutePath}")
    }
    if (artifactFile.length() <= 0L) {
        throw new GradleException("Publish artifact is empty for '${project.path}': ${artifactFile.absolutePath}")
    }
    return artifactFile
}

def appliedCurseForgePlugin = project.plugins.find { plugin ->
    plugin != null && plugin.getClass().getName() == 'net.darkhax.curseforgegradle.CurseForgeGradlePlugin'
}

def curseForgeTaskClass = [
        appliedCurseForgePlugin?.getClass()?.getClassLoader(),
        this.class.classLoader,
        Thread.currentThread().contextClassLoader,
        project.buildscript.classLoader
].findResult { loader ->
    if (loader == null) {
        return null
    }
    try {
        return Class.forName('net.darkhax.curseforgegradle.TaskPublishCurseForge', true, loader)
    } catch (Throwable ignored) {
        return null
    }
}

if (curseForgeTaskClass == null) {
    throw new GradleException("Unable to resolve TaskPublishCurseForge for project '${project.path}'")
}

tasks.register('verifyPublishArtifact') {
    group = 'Publishing'
    description = 'Verify that the configured final publish artifact exists before uploading.'
    dependsOn cecReadPublishArtifactTaskName()

    doLast {
        File artifactFile = cecVerifyPublishArtifactFile()
        println "Verified publish artifact for ${project.path}: ${artifactFile.absolutePath} (${artifactFile.length()} bytes)"
    }
}

tasks.register('PublishInfo') {
    group = 'Publishing'
    dependsOn cecReadPublishArtifactTaskName()

    doLast {
        println "Publish artifact path: ${cecReadPublishArtifactFile().absolutePath}"
        println "version = \"${cecReadPublishVersionId()}\"\n" +
                "    displayName = \"${cecReadPublishDisplayName()}\""
        println "loaders.cf = ${cecReadCurseForgeLoaders().join(',')}"
        println "loaders.modrinth = ${cecReadModrinthLoaders().join(',')}"
        def properties = cecReadPublishingProperties()
        if (properties != null) {
            println "CF_TOKEN: ${properties.getProperty('CF_TOKEN') == null ? 'missing' : 'present'}"
            println "MODRINTH_TOKEN: ${properties.getProperty('MODRINTH_TOKEN') == null ? 'missing' : 'present'}"
        } else {
            println "api.properties not exist"
        }
    }
}

tasks.register('publishInfo') {
    group = 'Publishing'
    description = 'Alias for PublishInfo.'
    dependsOn 'PublishInfo'
}

tasks.register('packagePublishArtifact') {
    group = 'Publishing'
    description = 'Build and verify the final publish artifact.'
    dependsOn cecReadPublishArtifactTaskName()
    dependsOn 'verifyPublishArtifact'
}

tasks.register('publishAll') {
    group = 'Publishing'
    dependsOn 'publishCurseForge'
    dependsOn 'publishMods'
    dependsOn 'verifyPublishArtifact'
}

tasks.register('publishCurseForge', curseForgeTaskClass) {
    dependsOn cecReadPublishArtifactTaskName()
    dependsOn 'verifyPublishArtifact'

    def properties = cecReadPublishingProperties()
    apiToken = properties?.getProperty('CF_TOKEN')

    def mainFile = upload(curseforge_id, cecReadPublishArtifactFile())
    mainFile.changelog = cecReadPrimaryChangelog()
    mainFile.addEnvironment('Client', 'Server')
    mainFile.addGameVersion("${minecraft_version}")
    cecReadCurseForgeLoaders().each { loaderName ->
        mainFile.addModLoader(loaderName)
    }
    cecReadRequiredDependencies().each { dependencyId ->
        mainFile.addRequirement(dependencyId)
    }
    cecReadOptionalDependencies().each { dependencyId ->
        mainFile.addOptional(dependencyId)
    }
    mainFile.displayName = cecReadPublishDisplayName()
    mainFile.releaseType = publish_version
    disableVersionDetection()
}

publishMods {
    def properties = cecReadPublishingProperties()
    def modrinthTokenGet = properties?.getProperty('MODRINTH_TOKEN')

    file = cecReadPublishArtifactFile()
    changelog = cecReadFullChangelog()
    type = STABLE
    version = cecReadPublishVersionId()
    displayName = cecReadPublishDisplayName()

    cecReadModrinthLoaders().each { loaderName ->
        modLoaders.add(loaderName)
    }

    if (modrinthTokenGet != null) {
        modrinth {
            accessToken = modrinthTokenGet
            projectId = "${modrinth_id}"
            minecraftVersions.add(minecraft_version)
            cecReadRequiredDependencies().each { dependencyId ->
                requires(dependencyId)
            }
            cecReadOptionalDependencies().each { dependencyId ->
                optional(dependencyId)
            }
        }
    }
}

tasks.matching { it.name in ['publishMods', 'publishModrinth'] }.configureEach {
    dependsOn cecReadPublishArtifactTaskName()
    dependsOn 'verifyPublishArtifact'
}
