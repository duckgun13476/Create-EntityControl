}

ext.cecReadPublishDisplaySuffix = {
    def configuredSuffix = project.findProperty('cec_publish_display_suffix')?.toString()?.trim()
    if (configuredSuffix != null && !configuredSuffix.isEmpty()) {
        return configuredSuffix.startsWith('_') ? configuredSuffix : "_${configuredSuffix}"
    }

    def loaderId = cecReadPublishLoaderId()
    return loaderId ? "_${loaderId}" : ''
}

ext.cecReadPublishVersionSuffix = {
    def configuredSuffix = project.findProperty('cec_publish_version_suffix')?.toString()?.trim()
    if (configuredSuffix != null && !configuredSuffix.isEmpty()) {
        return configuredSuffix.startsWith('-') ? configuredSuffix : "-${configuredSuffix}"
    }

    def loaderId = cecReadPublishLoaderId()
    return loaderId ? "-${loaderId}" : ''
}

ext.cecReadPublishDisplayName = {
    def versionParts = mod_version.toString().split('-', 2)
    def createPart = versionParts.length > 1 ? versionParts[1] : ''
    def createSuffix = createPart.isEmpty() ? '' : "_for_Create_v${createPart}"
    return "${display_name}_v${versionParts[0]}${createSuffix}${cecReadPublishDisplaySuffix()}"
}

ext.cecReadPublishVersionId = {
    return "${minecraft_version}-${mod_version}${cecReadPublishVersionSuffix()}"
}

ext.cecReadPublishCurseForgeLoaders = {
    return cecReadStringListProperty('cec_publish_curseforge_loaders')
}

ext.cecReadPublishModrinthLoaders = {
    return cecReadStringListProperty('cec_publish_modrinth_loaders')
}

ext.cecReadPublishRequiredDependencies = {
    return cecReadStringListProperty('cec_publish_required_dependencies', ['create'])
}

ext.cecReadPublishOptionalDependencies = {
