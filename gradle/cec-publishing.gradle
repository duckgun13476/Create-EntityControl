}

ext.cecReadCurseForgeUploadVersionIds = {
    // The legacy upload endpoint expects gameVersionId values, not Core API ids.
    Map<String, Long> minecraftVersionIds = [
            '1.19.2': 9366L,
            '1.20.1': 9990L,
            '1.21.1': 11779L
    ]
    Map<String, Long> loaderVersionIds = [
            'fabric'  : 7499L,
            'forge'   : 7498L,
            'neoforge': 10150L,
            'quilt'   : 9153L
    ]
    List<Long> versionIds = []
    Long minecraftVersionId = minecraftVersionIds[minecraft_version.toString()]
    if (minecraftVersionId == null) {
        throw new GradleException("No CurseForge upload gameVersionId mapping for Minecraft ${minecraft_version} in ${project.path}")
    }
    versionIds.add(minecraftVersionId)

    cecReadPublishCurseForgeLoaders().each { loaderName ->
        Long loaderVersionId = loaderVersionIds[loaderName.toString().trim().toLowerCase(Locale.ROOT)]
        if (loaderVersionId == null) {
            throw new GradleException("No CurseForge upload loader mapping for ${loaderName} in ${project.path}")
        }
        versionIds.add(loaderVersionId)
    }

    versionIds.add(9638L)
    versionIds.add(9639L)
    return versionIds.unique()
}

ext.cecReadCurseForgeUploadRelations = {
    Map<String, String> relationTypesBySlug = [:]
    cecReadPublishRequiredDependencies().each { dependencyId ->
        relationTypesBySlug[dependencyId.toString()] = 'requiredDependency'
    }
    cecReadPublishOptionalDependencies().each { dependencyId ->
        relationTypesBySlug[dependencyId.toString()] = 'optionalDependency'
    }

    def projects = relationTypesBySlug.collect { slug, relationType ->
        [slug: slug, type: relationType]
    }
    return projects.isEmpty() ? null : [projects: projects]
}

ext.cecReadCurseForgeUploadMetadata = {
    Map metadata = [
            changelog    : cecReadPrimaryChangelog(),
            changelogType: 'markdown',
            displayName  : cecReadPublishDisplayName(),
            releaseType  : publish_version.toString(),
            gameVersions : cecReadCurseForgeUploadVersionIds()
    ]
    def relations = cecReadCurseForgeUploadRelations()
    if (relations != null) {
        metadata.relations = relations
    }
    return metadata
}

ext.cecWriteMultipartTextPart = { OutputStream output, String boundary, String name, String content, String contentType ->
    output.write("--${boundary}\r\n".getBytes('UTF-8'))
    output.write("Content-Disposition: form-data; name=\"${name}\"\r\n".getBytes('UTF-8'))
    output.write("Content-Type: ${contentType}\r\n\r\n".getBytes('UTF-8'))
    output.write(content.getBytes('UTF-8'))
    output.write("\r\n".getBytes('UTF-8'))
}

ext.cecWriteMultipartFilePart = { OutputStream output, String boundary, String name, File file ->
    output.write("--${boundary}\r\n".getBytes('UTF-8'))
    output.write("Content-Disposition: form-data; name=\"${name}\"; filename=\"${file.name}\"\r\n".getBytes('UTF-8'))
    output.write("Content-Type: application/java-archive\r\n\r\n".getBytes('UTF-8'))
    file.withInputStream { InputStream input ->
        byte[] buffer = new byte[8192]
        int read
        while ((read = input.read(buffer)) > 0) {
            output.write(buffer, 0, read)
        }
    }
    output.write("\r\n".getBytes('UTF-8'))
}

ext.cecUploadCurseForgeFile = {
    String token = cecReadCurseForgeUploadApiToken()
    if (token == null || token.trim().isEmpty()) {
        throw new GradleException("Missing CF_TOKEN for CurseForge upload in ${project.path}")
    }

    File artifactFile = cecVerifyPublishArtifactFile()
    String endpoint = cecReadCurseForgeUploadEndpoint()
    String uploadUrl = "${endpoint}/api/projects/${cecUrlEncode(curseforge_id.toString())}/upload-file"
    String boundary = "cec-cf-${System.currentTimeMillis()}-${Math.abs(new Random().nextInt())}"
    HttpURLConnection connection = (HttpURLConnection) URI.create(uploadUrl).toURL().openConnection()
    connection.setRequestMethod('POST')
    connection.setConnectTimeout(cecPublishHttpTimeoutMillis())
    connection.setReadTimeout(Math.max(cecPublishHttpTimeoutMillis(), 180000))
    connection.setDoOutput(true)
    connection.setRequestProperty('X-Api-Token', token.trim())
    connection.setRequestProperty('User-Agent', cecPublishUserAgent())
    connection.setRequestProperty('Content-Type', "multipart/form-data; boundary=${boundary}")

    connection.outputStream.withCloseable { OutputStream output ->
        cecWriteMultipartTextPart(output, boundary, 'metadata', JsonOutput.toJson(cecReadCurseForgeUploadMetadata()), 'application/json; charset=UTF-8')
        cecWriteMultipartFilePart(output, boundary, 'file', artifactFile)
        output.write("--${boundary}--\r\n".getBytes('UTF-8'))
    }

    int responseCode = connection.getResponseCode()
    InputStream stream = responseCode >= 400 ? connection.getErrorStream() : connection.getInputStream()
    String body = stream == null ? '' : stream.getText('UTF-8')
    if (responseCode < 200 || responseCode >= 300) {
        String bodySummary = body == null ? '' : body.replaceAll(/\s+/, ' ').take(500)
        throw new GradleException("CurseForge upload failed for ${project.path}: POST ${uploadUrl} returned HTTP ${responseCode}${bodySummary.isEmpty() ? '' : " (${bodySummary})"}")
    }
    return body.trim().isEmpty() ? [:] : new JsonSlurper().parseText(body)
}

tasks.register('PublishInfo') {
    group = 'Publishing'

    doLast {
        println "Publish artifact path: ${cecReadPublishArtifactFile().absolutePath}"
        println "version = \"${cecReadPublishVersionId()}\"\n" +
                "    displayName = \"${cecReadPublishDisplayName()}\""
        println "loaders.cf = ${cecReadPublishCurseForgeLoaders().join(',')}"
        println "loaders.modrinth = ${cecReadPublishModrinthLoaders().join(',')}"
        println "dependencies.required = ${cecReadPublishRequiredDependencies().join(',')}"
        println "dependencies.optional = ${cecReadPublishOptionalDependencies().join(',')}"
        def properties = cecReadPublishingProperties()
        if (properties != null) {
            println "CF_TOKEN: ${properties.getProperty('CF_TOKEN') == null ? 'missing' : 'present'}"
            println "CurseForge Core API key source: ${cecReadCurseForgeApiKeySource() ?: 'missing'}"
            println "MODRINTH_TOKEN: ${properties.getProperty('MODRINTH_TOKEN') == null ? 'missing' : 'present'}"
        } else {
            println "api.properties not exist"
        }
    }
}

tasks.register('checkCurseForgePublishStatus') {
    group = 'Publishing'
    description = 'Checks CurseForge for an existing file matching this publish target.'

    doLast {
        boolean exists = cecCheckCurseForgePublished()
        if (cecPublishRemoteStatus.curseforgeLedgerIgnored) {
            println "CurseForge publish ledger ignored for ${project.path} because -Pcec_publish_force=true was set."
        } else if (cecPublishRemoteStatus.curseforgeLedgerMatch) {
            def match = cecPublishRemoteStatus.curseforgeLedgerMatch
            println "CurseForge local ledger has successful upload for ${project.path}; skipping upload. version=${match.versionId} loader=${match.loader} source=${match.source ?: 'ledger'}"
        } else if (cecPublishRemoteStatus.curseforgeCheckDisabled) {
            println "CurseForge remote publish check disabled for ${project.path}; no successful local ledger entry found, so upload will be attempted."
        } else if (cecPublishRemoteStatus.curseforgeRemoteUnknown) {
            println "CurseForge remote publish check is unavailable for ${project.path}; no successful local ledger entry found, so upload will be attempted. reason=${cecPublishRemoteStatus.curseforgeRemoteCheckError ?: 'unknown'}"
        } else if (exists) {
            def match = (cecPublishRemoteStatus.curseforgeMatches ?: [[:]])[0]
            println "CurseForge already has ${project.path} target; skipping upload if requested. id=${match.id ?: 'unknown'} displayName=${match.displayName ?: 'unknown'} fileName=${match.fileName ?: 'unknown'} fileStatus=${match.fileStatus ?: 'unknown'}"
        } else {
            println "CurseForge does not have ${project.path} target: displayName=${cecReadPublishDisplayName()} fileName=${cecReadPublishArtifactFile().name}"
        }
    }
}

tasks.register('checkModrinthPublishStatus') {
    group = 'Publishing'
    description = 'Checks Modrinth for an existing version matching this publish target.'

    doLast {
        boolean exists = cecCheckModrinthPublished()
        if (cecPublishRemoteStatus.modrinthCheckDisabled) {
            println "Modrinth remote publish check disabled for ${project.path}; upload task will not be skipped by remote status."
        } else if (exists) {
            def match = cecPublishRemoteStatus.modrinthMatch ?: [:]
            println "Modrinth already has ${project.path} target; skipping upload if requested. id=${match.id ?: 'unknown'} version=${match.version_number ?: cecReadPublishVersionId()} status=${match.status ?: 'unknown'}"
        } else {
            println "Modrinth does not have ${project.path} target: version=${cecReadPublishVersionId()}"
        }
    }
}

tasks.register('checkPublishRemoteStatus') {
    group = 'Publishing'
    description = 'Checks remote publishing platforms for existing targets before upload.'
    dependsOn 'checkCurseForgePublishStatus'
    dependsOn 'checkModrinthPublishStatus'
}

tasks.register('publishInfo') {
    group = 'Publishing'
    description = 'Alias for PublishInfo.'
    dependsOn 'PublishInfo'
}

tasks.register('publishAll') {
    dependsOn 'publishCurseForge'
    dependsOn 'publishMods'
    dependsOn 'checkPublishRemoteStatus'
    dependsOn 'verifyPublishArtifact'
    group = 'Publishing'
}

tasks.register('allworkPublishInfo') {
    group = 'Allwork'
    description = 'Allwork alias for PublishInfo.'
    dependsOn 'PublishInfo'
}

tasks.register('allworkPublishAll') {
    group = 'Allwork'
    description = 'Allwork alias for publishAll.'
    dependsOn 'publishAll'
}

tasks.register('allworkJarJar') {
    group = 'Allwork'
    description = 'Allwork alias for the configured final publish artifact task.'
    dependsOn cecReadPublishArtifactTaskName()
}

tasks.register('verifyPublishArtifact') {
    group = 'Publishing'
    description = 'Verify that the configured final publish artifact exists before uploading.'
    dependsOn cecReadPublishArtifactTaskName()

    doLast {
        File artifactFile = cecVerifyPublishArtifactFile()
        println "Verified publish artifact for ${project.path}: ${artifactFile.absolutePath} (${artifactFile.length()} bytes)"
    }
}

tasks.register('publishCurseForge') {
    dependsOn cecReadPublishArtifactTaskName()
    dependsOn 'verifyPublishArtifact'
    dependsOn 'checkCurseForgePublishStatus'

    onlyIf {
        boolean exists = cecPublishRemoteStatus.containsKey('curseforgeExists')
                ? (cecPublishRemoteStatus.curseforgeExists as boolean)
                : cecCheckCurseForgePublished()
        if (exists) {
            println "Skipping CurseForge upload for ${project.path}: successful local ledger or remote target already exists. Use -Pcec_publish_force=true to upload anyway."
            return false
        }
        return true
    }

    doLast {
        def response = cecUploadCurseForgeFile()
        cecWritePublishLedgerSuccessEntry('curseforge', [
                source: 'direct-curseforge-upload',
                fileId: response instanceof Map ? response.id : null
        ])
    }
}

publishMods {
    def properties = cecReadPublishingProperties()
    def modrinthTokenGet = properties?.getProperty('MODRINTH_TOKEN')

    file = cecReadPublishArtifactFile()
    changelog = cecReadFullChangelog()
    type = STABLE
    version = cecReadPublishVersionId()
    displayName = cecReadPublishDisplayName()

    cecReadPublishModrinthLoaders().each { loaderName ->
        modLoaders.add(loaderName)
    }

    if (modrinthTokenGet != null) {
        modrinth {
            accessToken = modrinthTokenGet
            projectId = "${modrinth_id}"
            minecraftVersions.add(minecraft_version)
            cecReadPublishRequiredDependencies().each { dependencyId ->
                requires(dependencyId)
            }
            cecReadPublishOptionalDependencies().each { dependencyId ->
                optional(dependencyId)
            }
        }
    }
}

tasks.matching { it.name in ['publishMods', 'publishModrinth'] }.configureEach {
    dependsOn cecReadPublishArtifactTaskName()
    dependsOn 'verifyPublishArtifact'
    dependsOn 'checkModrinthPublishStatus'

    onlyIf {
        boolean exists = cecPublishRemoteStatus.containsKey('modrinthExists')
                ? (cecPublishRemoteStatus.modrinthExists as boolean)
                : cecCheckModrinthPublished()
        if (exists) {
            println "Skipping Modrinth upload for ${project.path}: remote target already exists. Use -Pcec_publish_force=true to upload anyway."
            return false
        }
        return true
    }
}
